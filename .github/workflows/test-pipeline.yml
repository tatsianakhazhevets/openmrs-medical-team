name: Test pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: OpenMRS API and UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: Test
    outputs:
      has_allure_results: ${{ steps.check-reports.outputs.has_allure_results }}
      has_swagger_report: ${{ steps.check-reports.outputs.has_swagger_report }}
    env:
      SELENOID_VIDEO_OUTPUT_DIR: ${{ github.workspace }}/infra/video
      MAVEN_REPOSITORY: ${{ github.workspace }}/.maven-cache
      BUILD_ENVIRONMENT: ci
      OPENMRS_STARTUP_TIMEOUT_SECONDS: 600
      GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      APP_COMPOSE_PROJECT: openmrs-app-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_COMPOSE_PROJECT: openmrs-tests-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Restore Maven dependency cache
        uses: actions/cache@v4
        with:
          path: .maven-cache
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml', 'infra/runner/Dockerfile') }}

      - name: Create CI environment file
        env:
          ENV_FILE_CONTENT: ${{ secrets.ENV_FILE || vars.ENV_FILE }}
        run: |
          if [ -z "$ENV_FILE_CONTENT" ]; then
            echo "Set ENV_FILE as an environment secret (recommended) or repository/environment variable."
            exit 1
          fi
          umask 077
          printf '%s' "$ENV_FILE_CONTENT" > .env
          unset ENV_FILE_CONTENT

      - name: Validate Compose configuration
        run: docker compose --env-file .env -f infra/docker-compose.yaml -f infra/docker-compose.ci.yaml -f infra/docker-compose.pipeline.yaml config --quiet

      - name: Run test pipeline
        run: bash infra/run-tests.sh --skip-restart

      - name: Collect service diagnostics
        if: always()
        run: |
          if [ -d target ]; then
            sudo chown -R "$(id -u):$(id -g)" target
          fi
          mkdir -p target/pipeline
          docker compose --env-file .env --project-name "$APP_COMPOSE_PROJECT" \
            -f infra/docker-compose.yaml -f infra/docker-compose.ci.yaml \
            ps --all > target/pipeline/compose-services.txt 2>&1 || {
              echo "Compose service status could not be collected." >> target/pipeline/compose-services.txt
            }
          docker compose --env-file .env --project-name "$APP_COMPOSE_PROJECT" \
            -f infra/docker-compose.yaml -f infra/docker-compose.ci.yaml \
            logs --no-color --timestamps 2>&1 |
            sed -E \
              -e 's/((password|passwd|token|secret|api[_-]?key)[^=:]{0,20}[=:][[:space:]]*)[^[:space:],;]+/\1[REDACTED]/Ig' \
              -e 's/(Authorization[[:space:]]*:[[:space:]]*(Basic|Bearer)[[:space:]]+)[^[:space:]]+/\1[REDACTED]/Ig' \
              -e 's|://[^:/[:space:]]+:[^@/[:space:]]+@|://[REDACTED]@|g' \
            > target/pipeline/compose.log || {
              echo "Compose logs could not be collected." >> target/pipeline/compose.log
            }

      - name: Check report availability
        id: check-reports
        if: always()
        run: |
          if [ -d target/allure-results ] && find target/allure-results -type f -print -quit | grep -q .; then
            echo "has_allure_results=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_allure_results=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -s target/pipeline/swagger-coverage-report.html ]; then
            echo "has_swagger_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_swagger_report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test, coverage, and diagnostic artifacts
        id: upload-artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/allure-results/
            target/pipeline/
            target/swagger-coverage-output/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Allure results for publication
        if: always() && steps.check-reports.outputs.has_allure_results == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/allure-results/
          if-no-files-found: error
          retention-days: 7

      - name: Upload Swagger coverage report for publication
        if: always() && steps.check-reports.outputs.has_swagger_report == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: swagger-coverage-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/pipeline/swagger-coverage-report.html
          if-no-files-found: error
          retention-days: 7

      - name: Add summary to workflow
        if: always()
        env:
          ARTIFACT_URL: ${{ steps.upload-artifacts.outputs.artifact-url }}
        run: |
          if [ -s target/pipeline/summary.md ]; then
            cat target/pipeline/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pipeline summary was not generated. See the uploaded Compose and runner logs." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$ARTIFACT_URL" ]; then
            printf '\n[Download test artifacts](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop the test environment
        if: always()
        run: |
          docker compose --env-file .env --project-name "$APP_COMPOSE_PROJECT" \
            -f infra/docker-compose.yaml -f infra/docker-compose.ci.yaml \
            down --volumes --remove-orphans

  publish-report:
    name: Publish Allure report
    needs: integration
    if: ${{ always() && needs.integration.outputs.has_allure_results == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-publishing
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Check out gh-pages history
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Download Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/allure-results

      - name: Download Swagger coverage report
        if: needs.integration.outputs.has_swagger_report == 'true'
        uses: actions/download-artifact@v4
        with:
          name: swagger-coverage-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: swagger-report

      - name: Build Allure report
        uses: simple-elf/allure-report-action@master
        with:
          gh_pages: gh-pages
          allure_results: target/allure-results
          allure_history: allure-history

      - name: Add Swagger coverage report to Allure
        if: needs.integration.outputs.has_swagger_report == 'true'
        run: |
          report_dir="allure-history/$GITHUB_RUN_NUMBER"
          cp swagger-report/swagger-coverage-report.html "$report_dir/swagger-coverage-report.html"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          index = Path("allure-history") / os.environ["GITHUB_RUN_NUMBER"] / "index.html"
          html = index.read_text(encoding="utf-8")
          link = '<p style="margin:1rem"><a href="swagger-coverage-report.html">Swagger coverage report</a></p>'
          html, count = re.subn(r"(<body\b[^>]*>)", r"\1" + link, html, count=1, flags=re.IGNORECASE)
          if count != 1:
              raise SystemExit(f"Could not add Swagger coverage link to {index}")
          index.write_text(html, encoding="utf-8")
          PY

      - name: Publish reports to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history
          keep_files: true
