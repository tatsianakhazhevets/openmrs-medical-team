#UI
uiRemote = http://localhost:4444/wd/hub
uiBaseUrl = http://host.docker.internal/openmrs/spa
uiBrowser = chrome
uiBrowserSize = 1920x1080
# Timeouts in ms. Override without code changes: -DuiTimeout=10000 or env UITIMEOUT=10000 (e.g. in CI)
# uiTimeout - default Selenide wait for every check / action (Configuration.timeout), Selenide default is 4000
uiTimeout = 4000
# uiLongTimeout - waits for parts the app loads lazily on first use: chart widgets, workspace forms, modals
uiLongTimeout = 15000
# how many times a page is loaded when the app does not render it (hung load in a fresh browser)
uiPageLoadAttempts = 2
# true - Selenoid records browser sessions, video is attached to Allure for failed UI tests (needs Selenoid video-recorder)
uiVideo = true
# true - one browser per test thread reused between tests (state reset, cache kept), restarted after a failed test;
# false - new browser for every test (see BrowserSessionExtension)
uiReuseBrowser = true
