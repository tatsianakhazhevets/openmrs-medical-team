services:
  gateway:
    image: openmrs/openmrs-reference-application-3-gateway:3.7.1
    restart: "unless-stopped"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - o3-network

  frontend:
    image: openmrs/openmrs-reference-application-3-frontend:3.7.1
    restart: "unless-stopped"
    environment:
      SPA_PATH: /openmrs/spa
      API_URL: /openmrs
      SPA_CONFIG_URLS: /openmrs/spa/config-core_demo.json
      SPA_DEFAULT_LOCALE:
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 60s
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - o3-network

  backend:
    image: openmrs/openmrs-reference-application-3-backend:3.7.1
    restart: "unless-stopped"
    depends_on:
      db:
        condition: service_healthy
    environment:
      OMRS_CONFIG_MODULE_WEB_ADMIN: "true"
      OMRS_CONFIG_AUTO_UPDATE_DATABASE: "true"
      OMRS_CONFIG_CREATE_TABLES: "true"
      OMRS_CONFIG_CONNECTION_SERVER: ${OMRS_DB_HOST}
      OMRS_CONFIG_CONNECTION_DATABASE: ${OMRS_DB_NAME}
      OMRS_CONFIG_CONNECTION_USERNAME: ${OMRS_DB_USER}
      OMRS_CONFIG_CONNECTION_PASSWORD: ${OMRS_DB_PASSWORD}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --silent --show-error --fail --max-time 5
          http://localhost:8080/openmrs/ws/rest/v1/session
          | grep -Eq '"authenticated"[[:space:]]*:[[:space:]]*(true|false)'
      interval: 10s
      timeout: 5s
      retries: 50
      start_period: 60s
    volumes:
      - ./openmrs-data:/openmrs/data
      - ./openmrs-snapshot-data/configuration_checksums:/openmrs/data/configuration_checksums:ro
      # Keep Lucene I/O on Docker's Linux filesystem, not the Windows bind mount.
      - openmrs-lucene:/openmrs/data/lucene
    networks:
      - o3-network

  # MariaDB
  db:
    image: mariadb:10.11.7
    restart: "unless-stopped"

    ports:
      - "3306:3306"

    command:
      - mysqld
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max-allowed-packet=256M

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mariadb --protocol=TCP --host=127.0.0.1
          --user="$$MYSQL_USER" --password="$$MYSQL_PASSWORD"
          "$$MYSQL_DATABASE" --execute='SELECT 1'
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 10s

    environment:
      MYSQL_DATABASE: ${OMRS_DB_NAME}
      MYSQL_USER: ${OMRS_DB_USER}
      MYSQL_PASSWORD: ${OMRS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - db-data:/var/lib/mysql
    networks:
      - o3-network

  selenoid:
    image: adtechqatools/selenoid:latest-release
    container_name: selenoid
    ports:
      - "4444:4444"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/etc/selenoid:ro
      - ./video:/opt/selenoid/video
    environment:
     OVERRIDE_VIDEO_OUTPUT_DIR: ${SELENOID_VIDEO_OUTPUT_DIR}
    command:
      - "-video-output-dir"
      - "/opt/selenoid/video"
      - "-container-network"
      - "o3-network"
    depends_on:
      - frontend
    networks:
      - o3-network

  selenoid-ui:
    image: aerokube/selenoid-ui
    container_name: selenoid-ui
    depends_on:
      - selenoid
    command:
      - "--selenoid-uri=http://selenoid:4444"
    ports:
      - "8080:8080"
    networks:
      - o3-network

volumes:
  db-data: ~
  openmrs-lucene: ~

networks:
  o3-network:
    name: o3-network
    driver: bridge